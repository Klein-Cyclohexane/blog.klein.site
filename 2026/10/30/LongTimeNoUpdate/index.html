Well, "I'll update the blog soon" somehow turned into several months of silence. I've been putting this off for way too long. If you've been checking back here, sorry for the accidental hibernation.

![An overdue apology](https://rayklein.rth1.xyz/Apologize.jpg)

I'll try to post more often from now on: little updates, things I've been learning, and projects that don't need to be perfectly finished before I write about them. Otherwise, every draft just becomes another "I'll get to it later."

I'll also finally sort through the glorious pile of spaghetti code I've accumulated. Some of it works; some of it works for reasons I no longer understand. It deserves a cleanup, a bit of refactoring, and a README that says more than "good luck."

So, more writing and less procrastinating. And hopefully, the next post will arrive before I need to write another apology. :)
